[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcdcli"
version = "0.1.0"
description = "McDonald's China MCP command-line client (https://mcp.mcd.cn)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["requests>=2.31"]

[project.scripts]
mcdcli = "mcdcli.cli:main"
